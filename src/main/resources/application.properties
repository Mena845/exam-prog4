# ============================
# Application
# ============================
spring.application.name=demo

# ============================
# Datasource (Neon - non-poja-managed-postgres)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP : petit volontairement.
# Sur Lambda, chaque instance ne traite qu'une requ�te � la fois,
# et Neon a une limite de connexions ouvertes (surtout en plan gratuit).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=270000

# ============================
# Flyway (migrations SQL)
# ============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ============================
# Upload de fichiers (endpoint POST /images)
# ============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================
# Jackson (dates ISO-8601 propres en JSON)
# ============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================
# Logging
# ============================
logging.level.root=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.com.example.demo=DEBUG

# ============================
# AWS (valeurs par défaut pour dev local)
# ============================
aws.s3.bucket=dummy-local-bucket
aws.eventBridge.bus=dummy-local-bus

# ============================
# Divers
# ============================
server.error.include-message=always
server.error.include-binding-errors=always